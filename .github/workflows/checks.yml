name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Create an ephemeral test signing key
        run: |
          python3 scripts/prepare_signing.py --output "$RUNNER_TEMP/preview-signing/preview.keystore"
          echo "PLANNER_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview-signing/preview.keystore" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test the standalone Android app
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug testDebugUnitTest
        working-directory: android
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-and-lint-results
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: chat-planner-build-only-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Create an ephemeral test signing key
        run: |
          python3 scripts/prepare_signing.py --output "$RUNNER_TEMP/preview-signing/preview.keystore"
          echo "PLANNER_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview-signing/preview.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo chmod 666 /dev/kvm
      - name: Verify local records, conversations and UI without a desktop server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test_android_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-results-and-previews
          path: |
            android/app/build/outputs/androidTest-results/connected/
            planner-previews/
          if-no-files-found: warn
  hita:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Create an ephemeral test signing key
        run: |
          python3 scripts/prepare_signing.py --output "$RUNNER_TEMP/preview-signing/preview.keystore"
          echo "PLANNER_PREVIEW_KEYSTORE=$RUNNER_TEMP/preview-signing/preview.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build pinned HITA compatible version and run upstream tests
        run: python3 scripts/build_hita.py --output "$RUNNER_TEMP/hita-planner" --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - name: Build the app used by the cross-app integration test
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest
        working-directory: android
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify HITA Room writes and the local cross-app connection
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$RUNNER_TEMP/hita-planner/app/build/outputs/apk/debug/app-debug.apk"
            cd "$RUNNER_TEMP/hita-planner" && ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
            # Gradle removes its tested APK after instrumentation; restore HITA for the cross-app test.
            adb install -r "$RUNNER_TEMP/hita-planner/app/build/outputs/apk/debug/app-debug.apk"
            cd "$GITHUB_WORKSPACE/android" && ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireHita=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hita-room-and-local-connection-test-results
          path: |
            ${{ runner.temp }}/hita-planner/app/build/outputs/androidTest-results/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: chat-planner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hita-planner-debug-apk
          path: ${{ runner.temp }}/hita-planner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
