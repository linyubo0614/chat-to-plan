name: release
on:
  push:
    tags: ['v*-preview', 'hita-v*-planner.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: chat-planner-debug-apk
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: hita-planner-debug-apk
          path: hita-assets
      - name: Prepare verified APK
        run: |
          mv release-assets/app-debug.apk release-assets/chat-planner-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release-assets/chat-planner-debug.apk
          cd release-assets
          sha256sum chat-planner-debug.apk > SHA256SUMS
      - name: Prepare Windows bundle and compatible APK
        run: |
          python3 scripts/package_windows.py --output release-assets/chat-planner-windows.zip
          mv hita-assets/app-debug.apk release-assets/HITA_Planner_3.0.3-planner.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release-assets/HITA_Planner_3.0.3-planner.1.apk
          cd release-assets
          sha256sum *.apk *.zip > SHA256SUMS
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/*.apk release-assets/*.zip release-assets/SHA256SUMS \
            --verify-tag --prerelease \
            --title "对话计划 $RELEASE_TAG 预览版" \
            --notes-file docs/release-preview.md
