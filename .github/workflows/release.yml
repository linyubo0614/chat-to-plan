name: release
on:
  push:
    tags: ['v*-preview', 'hita-v*-planner.*']
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Find successful checks for this exact commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKS_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$CHECKS_RUN" ]; then
            echo 'No successful checks for this commit; publish the tag only after all checks pass.' >&2
            exit 1
          fi
          echo "run_id=$CHECKS_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: chat-planner-debug-apk
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: hita-planner-debug-apk
          path: hita-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: chat-planner-windows-package
          path: windows-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified.outputs.run_id }}
      - name: Prepare verified APK
        run: |
          mv release-assets/app-debug.apk release-assets/chat-planner-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release-assets/chat-planner-debug.apk
          cd release-assets
          sha256sum chat-planner-debug.apk > SHA256SUMS
      - name: Prepare Windows bundle and compatible APK
        run: |
          cp windows-assets/chat-planner-windows.zip release-assets/chat-planner-windows.zip
          cp windows-assets/dist/ChatPlanner.exe release-assets/ChatPlanner.exe
          mv hita-assets/app-debug.apk release-assets/HITA_Planner_3.0.3-planner.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify release-assets/HITA_Planner_3.0.3-planner.2.apk
          cd release-assets
          sha256sum *.apk *.zip *.exe > SHA256SUMS
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/*.apk release-assets/*.zip release-assets/*.exe release-assets/SHA256SUMS \
            --verify-tag --prerelease \
            --title "对话计划 $RELEASE_TAG 预览版" \
            --notes-file docs/release-preview.md
