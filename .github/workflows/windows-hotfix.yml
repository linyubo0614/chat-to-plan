name: publish-windows-hotfix
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      check_run:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      CHECK_RUN: ${{ inputs.check_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify Windows checks and source tag
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag=os.environ['RELEASE_TAG'];run=os.environ['CHECK_RUN'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'windows-v[0-9.]+',tag)
          assert run.isdecimal()
          def api(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          check=api(f'repos/{repo}/actions/runs/{run}')
          assert check['path']=='.github/workflows/checks.yml'
          jobs=api(f'repos/{repo}/actions/runs/{run}/jobs?per_page=100')['jobs']
          assert any(j['name']=='windows' and j['conclusion']=='success' for j in jobs)
          ref=api(f'repos/{repo}/git/ref/tags/{tag}')['object']
          assert ref['type']=='commit' and ref['sha']==check['head_sha']
          print('Windows artifact source and successful native checks verified:',check['head_sha'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: chat-planner-windows-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.check_run }}
      - name: Publish verified Windows package
        run: |
          sha256sum chat-planner-windows.zip > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" chat-planner-windows.zip SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" chat-planner-windows.zip SHA256SUMS --verify-tag --prerelease --title "Windows ${RELEASE_TAG#windows-v}: Tomato bridge fix" --notes-file docs/release-windows-hotfix.md
          fi
